name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Conferir os tipos
        run: npm run check

      - name: Compilar o site
        run: npm run build
